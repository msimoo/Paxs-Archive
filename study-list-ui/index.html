<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PAXS Archive — DICOM Study List. Browse, search, and manage medical imaging studies in your PACS archive." />
  <link rel="icon" href="/static/logo/logo.ico" />
  <title>PAXS Archive — Study List</title>
  <script>
    /* Apply the persisted theme before first paint (dark reading-room is the
       default). Same key and same attribute as the dashboard, so the two UIs
       never disagree about which room the user is in. */
    (function () {
      try { var t = localStorage.getItem("paxs_theme"); document.documentElement.dataset.theme = (t === "light" ? "light" : "dark"); }
      catch (e) { document.documentElement.dataset.theme = "dark"; }
    })();
  </script>
  <!-- Hand-maintained UI enhancements (rich report editor, voice player, user chip). Part of the template so a frontend build cannot drop it. -->
  <link rel="stylesheet" href="/static/paxs-rich-editor.css?v=1" />
  <script defer src="/viewer/paxs-thumb-engine.js?v=39"></script><script defer src="/static/paxs-report-addenda.js?v=1"></script><script defer src="/static/paxs-rich-editor.js?v=1"></script><script defer src="/viewer/paxs-study-list-enhance.js?v=51"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>

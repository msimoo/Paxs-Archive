# Load-balanced PAXS deployment (roadmap #47).
#
#   docker compose -f deploy/docker-compose.lb.yml up -d --build
#
# Topology: HAProxy (:8000 API / :10400 DIMSE / :2575 HL7) -> 3 stateless
# PAXS nodes -> shared MySQL 8 + MinIO (shared object storage). Any node can
# die or restart; HAProxy fails it over. See deploy/LOAD-BALANCING.md.

services:
  haproxy:
    image: haproxy:3.0-alpine
    container_name: paxs-haproxy
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8000:8000"     # REST API / DICOMweb / dashboard
      - "10400:10400"   # DIMSE
      - "2575:2575"     # HL7 MLLP
      - "8404:8404"     # HAProxy stats page
      - "8405:8405"     # HAProxy Prometheus metrics (/metrics)
    depends_on:
      - paxs-node-1
      - paxs-node-2
      - paxs-node-3
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8404/;csv"]
      interval: 15s
      timeout: 3s
      retries: 3

  paxs-node-1: &paxs-node
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: paxs-node-1
    environment: &paxs-env
      PAXS_INSTANCE_ID: node-1
      DATABASE_URL: mysql+aiomysql://paxs_user:paxs@mysql:3306/paxs_db
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: paxs
      DICOM_RECEIVER_ENABLED: "true"
      WORKER_ENABLED: "true"
      HL7_ENABLED: "true"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    expose:
      - "8000"
      - "10400"
      - "2575"

  paxs-node-2:
    <<: *paxs-node
    container_name: paxs-node-2
    environment:
      <<: *paxs-env
      PAXS_INSTANCE_ID: node-2

  paxs-node-3:
    <<: *paxs-node
    container_name: paxs-node-3
    environment:
      <<: *paxs-env
      PAXS_INSTANCE_ID: node-3

  mysql:
    image: mysql:8.0
    container_name: paxs-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: paxs_db
      MYSQL_USER: paxs_user
      MYSQL_PASSWORD: paxs
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ppaxs"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: paxs-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # S3 API (named storage backend + DR replica target)
      - "9001:9001"   # MinIO console

volumes:
  mysql-data:
  minio-data:

# HAProxy for PAXS (roadmap #47 — Load Balancing).
#
# Frontends:
#   :8000  HTTP  — REST API + DICOMweb + dashboard, round-robin over stateless
#                  nodes with a GET /api/v1/health/ready check (503 => node down).
#   :10400 TCP   — DIMSE (C-STORE/FIND/MOVE/GET/...). The receiver binds this
#                  port on EVERY node; HAProxy load-balances associations.
#   :2575  TCP   — HL7 MLLP (ADT/ORM/ORU listeners).
#
# Nodes must be stateless: shared MySQL (DATABASE_URL) + shared object storage
# (S3/MinIO named backend). See deploy/LOAD-BALANCING.md.

global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    option dontlognull
    timeout connect 5s
    timeout client  60s
    timeout server  60s

# ------------------------------------------------------------------ Metrics
# Built-in Prometheus exporter (HAProxy >= 2.4). Scrape http://<host>:8405/metrics
# — per-node traffic comes from the paxs_api backend's server metrics
# (haproxy_server_http_responses_total{server="paxs-node-N"}), plus frontend
# HTTP request totals. See deploy/prometheus.yml + deploy/MONITORING.md.
frontend metrics_in
    bind *:8405
    mode http
    stats enable
    stats uri /metrics
    stats prometheus

# ------------------------------------------------------------------ HTTP API
frontend http_in
    bind *:8000
    mode http
    option httplog
    option forwardfor
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    default_backend paxs_api

backend paxs_api
    mode http
    balance roundrobin
    option httpchk GET /api/v1/health/ready
    http-check expect status 200
    # One line per node (adjust the list / scale the same block).
    server paxs-node-1 paxs-node-1:8000 check inter 10s fall 3 rise 2
    server paxs-node-2 paxs-node-2:8000 check inter 10s fall 3 rise 2
    server paxs-node-3 paxs-node-3:8000 check inter 10s fall 3 rise 2

# ------------------------------------------------------------------ DIMSE
frontend dimse_in
    bind *:10400
    mode tcp
    default_backend paxs_dimse

backend paxs_dimse
    mode tcp
    balance roundrobin
    # Generous timeouts: DICOM associations are long-lived and C-STORE can
    # push multi-GB studies (especially over WAN) — 60s defaults would abort.
    timeout connect 5s
    timeout client  900s
    timeout server  900s
    # TCP checks: the DICOM receiver listens on 10400 in every node.
    server paxs-node-1 paxs-node-1:10400 check
    server paxs-node-2 paxs-node-2:10400 check
    server paxs-node-3 paxs-node-3:10400 check

# ------------------------------------------------------------------ HL7 MLLP
frontend hl7_in
    bind *:2575
    mode tcp
    default_backend paxs_hl7

backend paxs_hl7
    mode tcp
    balance roundrobin
    timeout connect 5s
    timeout client  120s
    timeout server  120s
    server paxs-node-1 paxs-node-1:2575 check
    server paxs-node-2 paxs-node-2:2575 check
    server paxs-node-3 paxs-node-3:2575 check

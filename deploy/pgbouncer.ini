; PgBouncer transaction-pooling configuration for multi-node PAXS Archive clusters.
;
; Use when total configured PostgreSQL connections across API nodes + standalone
; workers (PAXS-Worker.exe / worker containers) exceed PostgreSQL max_connections.
;
; On every PAXS node pointing at PgBouncer (port 6432), set in .env:
;   DATABASE_URL=postgresql+asyncpg://paxs_user:PASSWORD@pgbouncer:6432/paxs_db
;   DB_PGBOUNCER_COMPAT=true

[databases]
paxs_db = host=postgres port=5432 dbname=paxs_db

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; SCRAM-SHA-256 matches PostgreSQL 14+ defaults; populate userlist.txt with PG hashes.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Transaction pooling multiplexes hundreds of PAXS API/DIMSE/worker pool slots onto
; a compact set of PostgreSQL backend connections (requires DB_PGBOUNCER_COMPAT=true).
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 40
min_pool_size = 10
reserve_pool_size = 10
reserve_pool_timeout = 3

; Match PostgreSQL/SQLAlchemy pool hygiene and drop abandoned idle transactions.
server_idle_timeout = 300
server_lifetime = 3600
server_reset_query = DISCARD ALL
idle_transaction_timeout = 60
query_wait_timeout = 30

; Allow SQLAlchemy/asyncpg startup parameters cleanly.
ignore_startup_parameters = extra_float_digits,options

admin_users = paxs_admin
stats_users = paxs_monitor
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

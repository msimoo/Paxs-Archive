[alembic]
# Script location is relative to the project root.
script_location = migrations
prepend_sys_path = .
# The URL is taken from DATABASE_URL in the app settings (.env) by migrations/env.py.
# sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic,paxs

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_paxs]
level = DEBUG
handlers =
qualname = paxs

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
